services:
  postgres:
    image: postgres:16-alpine
    container_name: batti-postgres
    environment:
      POSTGRES_USER: batti
      POSTGRES_PASSWORD: batti_local_dev
      POSTGRES_DB: batti
    ports:
      # 5433 on the host so this never collides with a locally installed Postgres
      - "5433:5432"
    volumes:
      - batti_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U batti -d batti"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  batti_pgdata:
